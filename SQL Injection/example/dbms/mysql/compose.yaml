# 공통 MySQL 8.4 예제 환경
# 실행 (SQL Injection 디렉터리에서): docker compose --project-directory example/dbms/mysql --env-file example/dbms/mysql/.env up -d
# 경로는 모두 이 파일 위치를 기준으로 해석된다.
name: web-security-example

services:
  mysql:
    # mysql:8.4.13 기반. conf/my.cnf를 0644 권한으로 포함하기 위해 로컬 빌드한다(Dockerfile 참고).
    build:
      context: .
    image: web-security-example/mysql:8.4.13
    pull_policy: build
    container_name: web-security-example-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 .env에 설정하세요}
      TZ: UTC
      # 프레임워크별 애플리케이션 계정 비밀번호 (init/03-users.sh에서 사용)
      SPRING_BOOT_DB_PASSWORD: ${SPRING_BOOT_DB_PASSWORD:?}
      NESTJS_DB_PASSWORD: ${NESTJS_DB_PASSWORD:?}
      EXPRESS_DB_PASSWORD: ${EXPRESS_DB_PASSWORD:?}
      FASTAPI_DB_PASSWORD: ${FASTAPI_DB_PASSWORD:?}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:?}
      READER_DB_PASSWORD: ${READER_DB_PASSWORD:?}
    ports:
      # 외부 인터페이스에 노출하지 않도록 localhost에만 바인딩한다.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./provision.sh:/opt/example/provision.sh:ro
    healthcheck:
      # 인증정보를 명령행에 노출하지 않도록 MYSQL_PWD 환경변수를 사용한다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - example

volumes:
  mysql-data:
    name: web-security-example-mysql-data

networks:
  example:
    # 프레임워크 컨테이너가 같은 이름으로 접속할 수 있도록 고정 이름을 사용한다.
    name: web-security-example
