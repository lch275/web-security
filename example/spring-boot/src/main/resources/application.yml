# 접속 정보는 환경변수(DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD)에서 읽는다.
server:
  port: ${APP_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: spring-boot-sql-injection-example
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    # Spring.md: allowMultiQueries 기본값(false)을 명시적으로 유지한다.
    # connectTimeout/socketTimeout(ms): 연결 및 소켓 읽기 타임아웃
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spring_boot_customer_db}?allowMultiQueries=false&connectTimeout=5000&socketTimeout=30000&connectionTimeZone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:spring_boot_app}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: spring-boot-example-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000
      # DB가 내려간 상태에서도 기동하고, 요청 시 503으로 응답한다.
      initialization-fail-timeout: -1
  jdbc:
    template:
      query-timeout: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      # 기동 시 DB 메타데이터 조회를 하지 않는다(DB 장애 시에도 기동 가능).
      # 메타데이터 대신 아래 DB 정보로 MySQL Dialect를 결정한다.
      hibernate.boot.allow_jdbc_metadata_access: false
      jakarta.persistence.database-product-name: MySQL
      jakarta.persistence.database-product-version: "8.4"
      jakarta.persistence.query.timeout: 10000

logging:
  level:
    root: INFO
    com.example.sqlinjection: INFO
